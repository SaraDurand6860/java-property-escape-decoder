[project]
name = "java-property-escape-decoder"
version = "0.1.0"
description = "Decodes Java properties file escape sequences, including \u####, \n, \t, \r, and \f."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
